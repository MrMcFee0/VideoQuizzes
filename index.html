<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoLesson Activity Index</title>
  <style>
    /* Basic reset and layout */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation (The Index) */
    #sidebar {
      width: 250px;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      transition: all 0.3s ease; /* Smooth transition if you change widths */
    }

    /* Class to hide the sidebar */
    #sidebar.hidden {
      display: none;
    }

    #sidebar h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
    }

    .nav-link {
      display: block;
      padding: 10px 15px;
      margin-bottom: 8px;
      background-color: transparent;
      color: #495057;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .nav-link:hover {
      background-color: #e9ecef;
    }

    .nav-link.active {
      background-color: #0d6efd;
      color: white;
    }

    /* Main Content Area */
    #main-content {
      flex: 1;
      padding: 30px;
      box-sizing: border-box;
      overflow-y: auto;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* Toggle Button Styles */
    .header-bar {
      margin-bottom: 20px;
    }

    .toggle-btn {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      color: #495057;
      transition: background-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-btn:hover {
      background-color: #e9ecef;
    }

    /* Content Sections (Pages) */
    .page-section {
      display: none; /* Hides all sections by default */
      animation: fadeIn 0.3s ease-in-out;
      flex: 1;
    }

    .page-section.active {
      display: block; /* Reveals the active section */
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Navigation Index -->
  <nav id="sidebar">
    <h2>Main Index</h2>
    <a class="nav-link" href="#page-1">Quiz 1</a>
    <a class="nav-link" href="#page-2">Quiz 2 (Placeholder)</a>
    <a class="nav-link" href="#page-3">Contact Info</a>
  </nav>

  <!-- Content Bodies -->
  <main id="main-content">
    
    <!-- Header bar that sits above the content -->
    <div class="header-bar">
      <button id="toggle-sidebar" class="toggle-btn">
        ☰ Toggle Index
      </button>
    </div>
    
    <!-- PAGE 1: Your original iframe -->
    <div id="page-1" class="page-section">
      <h2>Quiz 1</h2>
      
      <div style="width: 100%; max-width: 1100px; margin: 0 auto; aspect-ratio: 16 / 10; min-height: 480px; max-height: 70vh; display: flex; box-sizing: border-box; overflow: hidden;">
        <iframe 
          src="https://wayground.com/embed/quiz/6a8c8406e7559af305b19ca7"
          style="width: 100%; height: 100%; min-height: 550px; border: 0; overflow: hidden;"
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          allow="fullscreen"
          >
        </iframe>
      </div>

    </div>

    <!-- PAGE 2: Example of a second page -->
    <div id="page-2" class="page-section">
      <h2>Quiz 2</h2>
      <p>This is where you would paste the HTML block for a second quiz or different embedded content.</p>
    </div>

    <!-- PAGE 3: Example of a third page -->
    <div id="page-3" class="page-section">
      <h2>Contact Info</h2>
      <p>This page demonstrates that you can put standard text and HTML in these blocks, not just iframes.</p>
    </div>

  </main>

  <!-- Scripts -->
  <script>
    // --- 1. Toggle Sidebar Logic ---
    const toggleBtn = document.getElementById('toggle-sidebar');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
      // This switches the "hidden" class on and off every time it's clicked
      sidebar.classList.toggle('hidden');
    });


    // --- 2. URL Routing Logic ---
    function handleRouting() {
      let hash = window.location.hash || '#page-1';
      let pageId = hash.substring(1);
      
      if (!document.getElementById(pageId)) {
        pageId = 'page-1';
        hash = '#page-1';
      }

      const pages = document.querySelectorAll('.page-section');
      pages.forEach(page => page.classList.remove('active'));

      const links = document.querySelectorAll('.nav-link');
      links.forEach(link => link.classList.remove('active'));

      document.getElementById(pageId).classList.add('active');
      
      const activeLink = document.querySelector(`.nav-link[href="${hash}"]`);
      if (activeLink) {
        activeLink.classList.add('active');
      }
    }

    window.addEventListener('DOMContentLoaded', handleRouting);
    window.addEventListener('hashchange', handleRouting);
  </script>

</body>
</html>
