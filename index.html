  <div style="width: 100%; max-width: 1100px; margin: 0 auto; aspect-ratio: 16 / 10; min-height: 480px; max-height: 70vh; display: flex; box-sizing: border-box; overflow: hidden;">
  <iframe 
    src="https://wayground.com/embed/quiz/6a8c8406e7559af305b19ca7"
    style="width: 100%; height: 100%; min-height: 550px; border: 0; overflow: hidden;"
    allowfullscreen = "true"
    webkitallowfullscreen ="true"
    mozallowfullscreen = "true"
    allow = "fullscreen"
    >
  </iframe>
</div>

<script>
  window.addEventListener('load', () => {
    const wrapper = document.getElementById('embed-wrapper');
    const targetHeight = 500; // Target optimal height in pixels
    const availableHeight = window.innerHeight;
    
    if (availableHeight < targetHeight) {
      const scaleRatio = availableHeight / targetHeight;
      wrapper.style.transform = `scale(${scaleRatio})`;
    }
  });
</script>
