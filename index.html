<div id="embed-wrapper" style="width: 100%; transform-origin: top center; display: flex; flex-direction: column; gap: 8px;">
 <iframe src="https://wayground.com/embed/quiz/6a8c8406e7559af305b19ca7" title=" - Wayground" style="flex:1;" frameBorder="0" allowfullscreen></iframe>
  <a href="https://wayground.com/admin?source=embedFrame" target="_blank">Explore more at Wayground.</a></div>
  
</div>

<script>
  window.addEventListener('load', () => {
    const wrapper = document.getElementById('embed-wrapper');
    const targetHeight = 500; // Target optimal height in pixels
    const availableHeight = window.innerHeight;
    
    if (availableHeight < targetHeight) {
      const scaleRatio = availableHeight / targetHeight;
      wrapper.style.transform = `scale(${scaleRatio})`;
    }
  });
</script>
